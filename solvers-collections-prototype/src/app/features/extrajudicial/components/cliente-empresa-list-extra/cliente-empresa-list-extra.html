<div>
  <h3>Clientes Empresa (SOLVERS)</h3>
  <ul class="list-group">
    <li *ngFor="let empresa of clientesEmpresa"
        (click)="seleccionarEmpresa(empresa)"
        class="list-group-item"
        [class.active]="empresa.id === selectedEmpresa?.id">
      {{ empresa.razonSocial }} ({{ empresa.ruc }})
    </li>
  </ul>
</div>
